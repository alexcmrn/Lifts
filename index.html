<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #EDEDED;
  --surface: #FFFFFF;
  --field: #F5F5F5;
  --ink: #111111;
  --mute: #5E5E5E;
  --line: #D6D6D6;
  --pr: #D7322B;
  --pr-ink: #FFFFFF;
  --accent: #111111;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0D0D;
    --surface: #181818;
    --field: #232323;
    --ink: #F2F2F2;
    --mute: #A3A3A3;
    --line: #333333;
    --pr: #FF4A40;
    --pr-ink: #140504;
    --accent: #F2F2F2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0D0D;
  --surface: #181818;
  --field: #232323;
  --ink: #F2F2F2;
  --mute: #A3A3A3;
  --line: #333333;
  --pr: #FF4A40;
  --pr-ink: #140504;
  --accent: #F2F2F2;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 56px; }
h1, h2, h3, .num {
  font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
h1 { font-size: 2.6rem; line-height: 1; margin: 0; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 1.7rem; line-height: 1.1; margin: 0 0 10px; font-weight: 600; }
h3 { font-size: 1.4rem; line-height: 1.1; margin: 0; font-weight: 600; }
p { margin: 0; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.status { margin: 6px 0 0; font-size: .85rem; color: var(--mute); }

.unit { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.unit button {
  font: 600 1.05rem 'Barlow Condensed', sans-serif;
  min-width: 52px; height: 40px; border: 0; background: transparent; color: var(--mute); cursor: pointer;
}
.unit button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

nav.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
nav.tabs button {
  font: 600 1.35rem 'Barlow Condensed', sans-serif; background: none; border: 0; cursor: pointer;
  color: var(--mute); padding: 8px 0 9px; margin-bottom: -1px; border-bottom: 4px solid transparent;
  display: inline-flex; align-items: center; gap: 8px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pr); }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--pr); display: inline-block; }

button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.primary, .submit {
  border: 0; border-radius: 8px; cursor: pointer; background: var(--ink); color: var(--bg);
  font: 600 1.3rem 'Barlow Condensed', sans-serif; letter-spacing: .02em; height: 50px; padding: 0 22px;
}
.primary:active, .submit:active { transform: translateY(1px); }
.submit { width: 100%; height: 58px; font-size: 1.5rem; }
.secondary {
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); color: var(--ink);
  font: 600 1.15rem 'Barlow Condensed', sans-serif; height: 48px; padding: 0 18px;
}
.linkbtn { font: 500 .95rem 'Barlow', sans-serif; background: none; border: 0; padding: 6px 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
.linkbtn.danger.armed { color: var(--pr); font-weight: 600; }
.linkbtn.mute { color: var(--mute); }

.empty { color: var(--mute); max-width: 52ch; }
.sub { color: var(--mute); font-size: .92rem; }

/* idle workout */
.idle { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 16px 18px; }
.idle p { margin-bottom: 16px; color: var(--mute); }

/* active workout */
.wkhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.elapsed { font-size: 3rem; line-height: 1; font-weight: 700; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; margin-top: 12px; }
.exhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.last { color: var(--mute); font-size: .9rem; margin: 2px 0 8px; }
.srow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.srow .n { width: 1.6em; color: var(--mute); font: 600 1.1rem 'Barlow Condensed', sans-serif; }
.srow .load { font: 600 1.35rem 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
.srow .linkbtn { margin-left: auto; color: var(--mute); }
.entry { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: .85rem; color: var(--mute); font-weight: 500; }
.field input {
  height: 48px; width: 100%; padding: 0 12px; font: 500 1.2rem 'Barlow', sans-serif;
  color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px;
}
.err { color: var(--pr); font-weight: 500; margin-top: 8px; font-size: .95rem; }
.addex { margin-top: 18px; }
.addex .row { display: flex; gap: 10px; }
.addex .field { flex: 1; }
.endrow { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.endrow .linkbtn { align-self: center; }

/* summary */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 18px; }
.stat .num { font-size: 2rem; line-height: 1; font-weight: 700; display: block; }
.stat span.l { font-size: .85rem; color: var(--mute); }
.banner { border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-left-width: 6px; }
.banner.base { border-left-color: var(--accent); }
.banner.none { border-left-color: var(--mute); }
.banner .t { font: 700 2.2rem/1.05 'Barlow Condensed', sans-serif; }
.banner.none .t { font-size: 1.6rem; font-weight: 600; }
.banner .bx { font: 600 1.25rem 'Barlow Condensed', sans-serif; margin-top: 12px; }
.banner p.l { margin-top: 1px; }
.banner.pr { background: var(--pr); color: var(--pr-ink); border-color: var(--pr); animation: stamp .24s ease-out; }
@keyframes stamp { from { transform: scale(1.1) rotate(-1.2deg); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .banner.pr { animation: none; } }
.recap { margin-top: 22px; }
.recap h3 { margin-bottom: 6px; }
.exrow { padding: 10px 0; border-top: 1px solid var(--line); }
.exrow .name { font: 600 1.25rem 'Barlow Condensed', sans-serif; margin-right: 8px; }
.setline { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 2px; }
.setline .s { font: 600 1.15rem 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
.chip { font: 600 .78rem 'Barlow', sans-serif; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); margin-left: 6px; vertical-align: 2px; }
.chip.pr { background: var(--pr); border-color: var(--pr); color: var(--pr-ink); }
.after { margin-top: 20px; }

/* records */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: .88rem; color: var(--mute); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.r, td.r { text-align: right; padding-right: 0; }
td .num { font-size: 1.3rem; font-weight: 600; }
td small { color: var(--mute); font-size: .85rem; }
.liftbtn {
  font: 600 1.3rem 'Barlow Condensed', sans-serif; background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ink); text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px;
}
tr.sel .liftbtn { text-decoration-color: var(--pr); text-decoration-thickness: 3px; }
.detail { margin-top: 30px; }
.detail h3.big { font-size: 1.9rem; margin-bottom: 10px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .cap { margin-top: 2px; font-size: .88rem; color: var(--mute); }
.sect { margin-top: 24px; }
.sect h4 { margin: 0 0 6px; font: 600 1.25rem 'Barlow Condensed', sans-serif; }
.rm { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.rm div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.rm .num { font-size: 1.5rem; font-weight: 600; line-height: 1.1; display: block; }
.rm small { color: var(--mute); }
.tl { padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.tl .d { color: var(--mute); font-size: .9rem; min-width: 6.5em; }
.tl .s { font: 600 1.2rem 'Barlow Condensed', sans-serif; }

/* history */
.wk { padding: 14px 0 6px; border-top: 1px solid var(--line); }
.wkh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.wkh h3 { margin-right: auto; }
.wkh .sub { flex-basis: 100%; order: 3; }
.wkh .linkbtn { order: 2; }
.more { margin-top: 12px; }
.wkbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 10px 0; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
.wkmain { display: flex; flex-direction: column; min-width: 0; }
.wkt { font: 600 1.4rem/1.15 'Barlow Condensed', sans-serif; }
.wkside { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.chev { color: var(--mute); font-size: 1.1rem; width: 1em; text-align: center; }
.wkdel { padding: 6px 0 8px; }
nav.tabs { overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex-shrink: 0; white-space: nowrap; }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.weeknav h2 { margin: 0; font-size: 1.6rem; }
.wnbtns { display: flex; gap: 6px; }
.iconbtn { height: 44px; min-width: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 600 1.2rem 'Barlow Condensed', sans-serif; cursor: pointer; }
.drow { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.dlabel { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; gap: 2px; }
.dname { font-size: .85rem; color: var(--mute); font-weight: 500; }
.dnum { font: 700 1.9rem/1 'Barlow Condensed', sans-serif; }
.drow.today .dnum { color: var(--pr); }
.dbody { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sitem { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.sname { font: 600 1.3rem/1.1 'Barlow Condensed', sans-serif; }
.sitem .chip { margin-left: 0; }
.acts2 { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.primary.small { height: 38px; font-size: 1.1rem; padding: 0 16px; }
.chip.done { border-color: var(--accent); color: var(--accent); }
.picker { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.picker .secondary { height: 44px; text-align: left; }
.chk { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.chk input { width: 20px; height: 20px; }
.addbtn { align-self: flex-start; }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.mh { text-align: center; font-size: .8rem; color: var(--mute); font-weight: 500; padding: 2px 0 4px; }
.cell { min-height: 52px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; padding: 6px 0 0; font: 600 1.2rem/1 'Barlow Condensed', sans-serif; }
.cell.today { box-shadow: inset 0 -3px 0 var(--pr); }
.cell[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dots { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; min-height: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.done { background: var(--accent); }
.dot.pr { background: var(--pr); }
.dot.planned { box-sizing: border-box; border: 1.5px solid var(--mute); }
.cell[aria-pressed="true"] .dot.done { background: var(--bg); }
.cell[aria-pressed="true"] .dot.planned { border-color: var(--bg); }
.dayd { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dayd h3 { font-size: 1.7rem; margin-bottom: 2px; }
.dayd .wk { padding: 0; border-top: 1px solid var(--line); }
.dot.eaten { border-radius: 2px; background: var(--mute); }
.cell[aria-pressed="true"] .dot.eaten { background: var(--bg); }
.mform { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
.mform .wide { grid-column: 1 / -1; }
.mform .submit { grid-column: 1 / -1; height: 54px; font-size: 1.4rem; margin-top: 4px; }
.mform .err { grid-column: 1 / -1; margin: 0; }
.meal { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.mn { display: flex; flex-direction: column; min-width: 0; }
.mname { font: 600 1.3rem/1.15 'Barlow Condensed', sans-serif; }
.cell { min-height: 60px; }
.kc { font: 600 .62rem/1 'Barlow Condensed', sans-serif; color: var(--mute); white-space: nowrap; max-width: 100%; overflow: hidden; }
.kc.over { color: var(--pr); }
.cell[aria-pressed="true"] .kc:not(.over) { color: var(--bg); opacity: .85; }
.tbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 2px; }
.tbar i { display: block; height: 100%; background: var(--accent); }
.tbar i.over { background: var(--pr); }
.tleft { margin: 4px 0 0; }
.calclink { display: block; margin: -6px 0 14px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 6px 0 18px; display: flex; flex-direction: column; gap: 12px; }
.calc h3 { margin: 0; }
.crow { display: flex; flex-wrap: wrap; gap: 10px; }
.cfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; }
.actl { display: flex; flex-direction: column; gap: 6px; }
.actbtn { text-align: left; display: flex; flex-direction: column; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); cursor: pointer; font: inherit; }
.actbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.actbtn .an { font: 600 1.15rem/1.1 'Barlow Condensed', sans-serif; }
.cstats { grid-template-columns: 1fr 1fr; margin: 0; }
.calc .secondary { height: 42px; }
.scanbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 4px 0 12px; display: flex; flex-direction: column; gap: 8px; }
.sgrow { display: flex; gap: 12px; align-items: flex-end; }
.sgrow .field { flex: 1; }
.scanov { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.scanov[hidden] { display: none; }
.scansheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 100%; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.scansheet h3 { margin: 0; }
.scanvid { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; border-radius: 10px; }
.scanman { display: flex; gap: 10px; align-items: flex-end; }
.scanman .field { flex: 1; }
:root { --warm: #757575; --drop: #D7322B; --ok: #111111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --warm: #9E9E9E; --drop: #FF4A40; --ok: #F2F2F2; } }
:root[data-theme="dark"] { --warm: #9E9E9E; --drop: #FF4A40; --ok: #F2F2F2; }
.ex.done { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.srow { border-left: 4px solid transparent; padding-left: 8px; }
.srow.warmup { border-left-color: var(--warm); }
.srow.working { border-left-color: var(--accent); }
.srow.drop { border-left-color: var(--drop); }
.srow.pending { opacity: .8; }
.srow.pending .load { color: var(--mute); font-weight: 500; }
.tick { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: var(--pr-ink); font: 700 .85rem/1 'Barlow', sans-serif; flex-shrink: 0; }
.ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; }
.exhead h3 .tick { vertical-align: 2px; margin-right: 4px; }
.tchip { font: 600 .75rem 'Barlow', sans-serif; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; margin-left: 6px; vertical-align: 2px; }
.srow .tchip { margin-left: 0; }
.tchip.warmup { color: var(--warm); }
.tchip.working { color: var(--accent); }
.tchip.drop { color: var(--drop); }
.typesel { display: flex; gap: 6px; margin-top: 10px; }
.tbtn { flex: 1; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--mute); font: 600 1.05rem 'Barlow Condensed', sans-serif; cursor: pointer; }
.tbtn[aria-pressed="true"] { color: var(--pr-ink); }
.tbtn.warmup[aria-pressed="true"] { background: var(--warm); border-color: var(--warm); }
.tbtn.working[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.tbtn.drop[aria-pressed="true"] { background: var(--drop); border-color: var(--drop); }
.entry.c1 { grid-template-columns: 1fr auto; }
.pe-row .pe-act, .pe-row .pills { grid-column: 1 / -1; }
.pills { display: flex; flex-direction: column; gap: 6px; }
.pills .pl { font-size: .9rem; color: var(--mute); font-weight: 500; }
.pills .pl .sub { margin-left: 6px; font-weight: 400; }
.setpills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { min-height: 38px; padding: 0 12px; border-radius: 99px; border: 1.5px solid currentColor; background: transparent; font: 600 1rem 'Barlow Condensed', sans-serif; cursor: pointer; }
.pill.warmup { color: var(--warm); }
.pill.working { color: var(--accent); }
.pill.drop { color: var(--drop); }
.pill.add { color: var(--mute); min-width: 38px; padding: 0; }
.catsel { display: flex; }
.catsel button { flex: 1; min-width: 0; padding: 0 4px; }
.msec { margin-top: 18px; }
.msec:first-child { margin-top: 4px; }
.msech { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.msech h4 { margin: 0; }
.msec > .sub { margin: 0 0 4px; }
/* ---- consistency pass: one set of sizes, radii and spacing ---- */
:root { --r-card: 12px; --r-ctl: 10px; --h-ctl: 48px; --h-sm: 40px; --pad: 16px; --sec: 24px; }
h2 { font-size: 1.7rem; margin: 0 0 16px; }
h3 { font-size: 1.4rem; }
.pagehead, .wkhead, .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; }
.pagehead h2, .wkhead h2, .weeknav h2 { margin: 0; min-width: 0; font-size: 1.7rem; }
.wnbtns { display: flex; gap: 6px; flex-shrink: 0; }
#panel > * + * { margin-top: 16px; }
#panel > .sect, #panel > .recap, #panel > .dayd, #panel > .detail { margin-top: var(--sec); }
.primary, .secondary, .iconbtn, .linkbtn, .chip, .tchip, .pill, .tbtn, .unit button, .srow .load { white-space: nowrap; }
.primary, .secondary { height: var(--h-ctl); border-radius: var(--r-ctl); padding: 0 20px; font-size: 1.2rem; }
.primary.small { height: var(--h-sm); padding: 0 16px; font-size: 1.1rem; }
.submit { height: var(--h-ctl); border-radius: var(--r-ctl); font-size: 1.3rem; margin-top: 4px; }
.iconbtn { height: var(--h-sm); border-radius: var(--r-ctl); }
.unit { border-radius: var(--r-ctl); }

      var nm = { id: uid(), date: m.date, name: String(m.name), kcal: num(m.kcal, 0), p: num(m.p, 0), c: num(m.c, 0), f: num(m.f, 0), ts: num(m.ts, Date.now()) };

    if (auth.focusId) { var f = $(auth.focusId); if (f) f.focus(); auth.focusId = null; }
  }

  /* ---------- PR analysis ---------- */
  // Walks every set in date order. A lift's first session is its baseline, so nothing in it counts as a PR.
  function analyze(entries) {
    var out = {};
    var per = {};
    entries.slice().sort(cmpEntries).forEach(function (e) {
      if (!counts(e)) { out[e.id] = { first: false, types: [] }; return; }
      var k = key(e.ex);
      var s = per[k] || (per[k] = { base: grp(e), maxKg: -1, maxE: -1, sets: [] });
      var res = { first: grp(e) === s.base, types: [] };
      var ee = e1rm(e.kg, e.reps);
      if (!res.first) {
        if (e.kg > s.maxKg + EPS) res.types.push({ t: 'weight', prev: s.maxKg });
        if (ee !== null && s.maxE > 0 && ee > s.maxE + 0.05) res.types.push({ t: 'e1rm', prev: s.maxE });
        var atOrAbove = s.sets.filter(function (x) { return x.kg >= e.kg - EPS; });
        if (atOrAbove.length) {
          var mr = Math.max.apply(null, atOrAbove.map(function (x) { return x.reps; }));
          if (e.reps > mr) res.types.push({ t: 'reps', prev: mr });
        }
      }
      s.maxKg = Math.max(s.maxKg, e.kg);
      if (ee !== null) s.maxE = Math.max(s.maxE, ee);
      s.sets.push({ kg: e.kg, reps: e.reps });
      out[e.id] = res;
    });
    return out;
  }
  // Collapses the flagged sets of one lift in one workout into one line per PR type.
  function exPRs(sets, flags) {
    var res = { lines: [], base: false };
    var by = { weight: [], e1rm: [], reps: [] };
    sets.forEach(function (e) {
      var f = flags[e.id];
      if (!f) return;
      if (f.first) res.base = true;
      f.types.forEach(function (t) { by[t.t].push({ e: e, t: t }); });
    });
    var u = state.unit;
    if (by.weight.length) {
      var w0 = by.weight[0], w1 = by.weight[by.weight.length - 1];
      res.lines.push('Weight PR: ' + fmtW(w1.e.kg) + ' ' + u + ', up from ' + fmtW(w0.t.prev) + ' ' + u);
    }
    if (by.e1rm.length) {
      var q0 = by.e1rm[0], q1 = by.e1rm[by.e1rm.length - 1];
      res.lines.push('Est. 1RM PR: ' + fmtW(e1rm(q1.e.kg, q1.e.reps)) + ' ' + u + ', up from ' + fmtW(q0.t.prev) + ' ' + u);
    }
    if (by.reps.length) {
      var r1 = by.reps[by.reps.length - 1];
      res.lines.push('Rep PR: ' + r1.e.reps + ' reps at ' + fmtW(r1.e.kg) + ' ' + u + ' (previous best ' + r1.t.prev + ')');
    }
    return res;
  }
  function bests(k) {
    var heavy = null, est = null, estVal = -1;
    state.entries.forEach(function (e) {
      if (key(e.ex) !== k || !counts(e)) return;
      if (!heavy || e.kg > heavy.kg + EPS || (Math.abs(e.kg - heavy.kg) <= EPS && e.reps > heavy.reps)) heavy = e;
      var v = e1rm(e.kg, e.reps);
      if (v !== null && v > estVal) { estVal = v; est = e; }
    });
    return { heavy: heavy, est: est, estVal: estVal };
  }
  function lastSession(k, exWid) {
    var best = null;
    state.entries.forEach(function (e) {
      if (key(e.ex) !== k || e.type === 'warmup' || (exWid && e.wid === exWid)) return;
      if (!best || cmpEntries(best, e) < 0) best = e;
    });
    if (!best) return [];
    var g = grp(best);
    return state.entries.filter(function (e) { return key(e.ex) === k && e.type !== 'warmup' && grp(e) === g; }).sort(cmpEntries);
  }
  /* ---------- shared bits of markup ---------- */
  var TYPES = [['warmup', 'Warmup'], ['working', 'Working'], ['drop', 'Drop']];
  // Only working sets of strength lifts count towards PRs and records.
  function counts(e) { return !e.cardio && e.type !== 'warmup' && e.type !== 'drop'; }
  function typeOf(e) { return e.type === 'warmup' || e.type === 'drop' ? e.type : 'working'; }
  function fmtMins(m) { return String(+Number(m).toFixed(1)); }
  function setText(e) {
    return e.cardio ? fmtMins(e.mins) + ' min' : fmtW(e.kg) + ' ' + state.unit + ' \u00D7 ' + e.reps;
  }
  function chips(info) {
    if (!info || !info.types.length) return '';
    var map = { weight: 'Weight PR', e1rm: 'Est. 1RM PR', reps: 'Rep PR' };
    return info.types.map(function (t) { return '<span class="chip pr">' + map[t.t] + '</span>'; }).join('');
  }
  function typeChip(e) {
    if (e.cardio) return '';
    var t = typeOf(e);
    return '<span class="tchip ' + t + '">' + (t === 'warmup' ? 'Warmup' : t === 'drop' ? 'Drop' : 'Working') + '</span>';
  }
  function setLine(sets, flags) {
    return '<div class="setline">' + sets.map(function (e) {
      return '<span class="s">' + setText(e) + typeChip(e) + chips(flags[e.id]) + '</span>';
    }).join('') + '</div>';
  }
  function recapRows(sets, flags) {
    return groupByEx(sets).map(function (g) {
      var p = exPRs(g.sets, flags);
      return '<div class="exrow"><span class="name">' + esc(g.name) + '</span>' +
        (g.sets[0].cardio ? '<span class="chip">Cardio</span>' : '') +
        (p.base ? '<span class="chip">Baseline</span>' : '') + setLine(g.sets, flags) + '</div>';
    }).join('');
  }

  /* ---------- Workout tab ---------- */
  function getDraft(k) { return ui.drafts[k] || (ui.drafts[k] = { w: '', r: '', m: '', type: 'working', manual: false }); }

  // What to compare against: the saved benchmark if there is one, otherwise the last session.
  function reference(k, exWid) {
    var b = state.bench[k];
    if (b && b.sets && b.sets.length) return { label: 'Benchmark', date: b.date, sets: b.sets };
    var s = lastSession(k, exWid);
    if (!s.length) return null;
    return {
      label: 'Last time', date: s[0].date,
      sets: s.map(function (e) { return { kg: e.kg, reps: e.reps, mins: e.mins || 0, cardio: !!e.cardio, type: typeOf(e) }; })
    };
  }
  function refText(sets) {
    return sets.slice(0, 8).map(function (s) {
      return s.cardio ? fmtMins(s.mins) + ' min' : fmtW(s.kg) + ' \u00D7 ' + s.reps + (s.type === 'drop' ? ' (drop)' : '');
    }).join(', ');
  }
  function prefill(name) {
    var k = key(name), d = getDraft(k);
    var ref = reference(k, state.active ? state.active.id : null);
    if (!ref) return;
    var pool = ref.sets.filter(function (s) { return s.type !== 'drop'; });
    var last = (pool.length ? pool : ref.sets)[(pool.length ? pool : ref.sets).length - 1];
    if (last.cardio) d.m = fmtMins(last.mins);
    else { d.w = fmtW(last.kg); d.r = String(last.reps); }
  }

  function unitToggleHTML() {
    return '<div class="unit" role="group" aria-label="Weight unit">' + ['kg', 'lb'].map(function (u) {
      return '<button type="button" data-a="unit" data-unit="' + u + '" aria-pressed="' + (state.unit === u) + '">' + u + '</button>';
    }).join('') + '</div>';
  }

  // Planned sets are slots like ['warmup', 'working', 'working', 'drop']. A logged set fills the first
  // open slot of its own type; whatever is left open is still to do.
  function exStatus(a, name) {
    var k = key(name);
    var sets = state.entries.filter(function (e) { return e.wid === a.id && key(e.ex) === k; }).sort(cmpEntries);
    var cardio = !!(a.cardio && a.cardio[k]);
    var tg = (a.targets || {})[k];
    var slots = tg ? (cardio ? ['working'] : planSlots(tg)) : [];
    var have = { warmup: 0, working: 0, drop: 0 };
    sets.forEach(function (e) { have[cardio ? 'working' : typeOf(e)]++; });
    var seen = { warmup: 0, working: 0, drop: 0 };
    var pending = [], filled = 0;
    slots.forEach(function (t) {
      seen[t]++;
      if (seen[t] <= have[t]) filled++; else pending.push(t);
    });
    return { k: k, sets: sets, cardio: cardio, slots: slots, pending: pending, next: pending[0] || null,
      filled: filled, target: slots.length, done: slots.length > 0 && !pending.length };
  }
  function activeHTML() {
    var a = state.active;
    var withT = a.exercises.map(function (n) { return exStatus(a, n); }).filter(function (s) { return s.target > 0; });
    var doneN = withT.filter(function (s) { return s.done; }).length;
    var html = '<div class="wkhead"><div><div class="elapsed num" id="elapsed">' + fmtDur(Date.now() - a.start) + '</div>' +
      '<div class="sub">' + esc((a.plan ? a.plan + ' in progress' : 'Workout in progress') + (withT.length ? ' \u00B7 ' + doneN + ' of ' + withT.length + ' done' : '')) + '</div></div>' +
      '<div class="wkright">' + unitToggleHTML() + '<button type="button" class="primary" data-a="finish">Finish workout</button></div></div>';
    if (ui.err && ui.err.i === -1) html += '<p class="err">' + esc(ui.err.msg) + '</p>';

    a.exercises.forEach(function (name, i) {
      var st = exStatus(a, name);
      var d = getDraft(st.k);
      var ref = reference(st.k, a.id);
      if (!d.manual) d.type = st.next || 'working';
      html += '<div class="ex' + (st.done ? ' done' : '') + '"><div class="exhead"><h3>' +
        (st.done ? '<span class="tick" aria-label="All sets done">\u2713</span> ' : '') + esc(name) +
        (st.cardio ? ' <span class="chip">Cardio</span>' : '') + '</h3>' +
        (st.sets.length ? '' : '<button type="button" class="linkbtn mute" data-a="rmex" data-i="' + i + '">Remove</button>') + '</div>';
      if (st.target) {
        html += '<p class="tgt">' + (st.cardio ? 'Cardio planned' : 'Plan: ' + slotsLabel(st.slots)) + ' \u00B7 ' +
          st.filled + ' of ' + st.target + ' done</p>';
      }
      if (ref) {
        html += '<p class="last">' + ref.label + ' (' + fmtDate(ref.date) + '): ' + esc(refText(ref.sets)) +
          (st.cardio ? '' : ' ' + state.unit) + '</p>';
      }

      var wn = 0;
      st.sets.forEach(function (e) {
        var t = typeOf(e);
        var label = (e.cardio || t === 'working') ? String(++wn) : (t === 'warmup' ? 'W' : 'D');
        html += '<div class="srow ' + t + '"><span class="n">' + label + '</span><span class="load">' + setText(e) + '</span>' +
          typeChip(e) + '<span class="tick" role="img" aria-label="Completed">\u2713</span>' +
          '<button type="button" class="linkbtn" data-a="rmset" data-id="' + e.id + '" aria-label="Remove set ' + label + ' of ' + esc(name) + '">Remove</button></div>';
      });
      st.pending.forEach(function (t) {
        var label = t === 'warmup' ? 'W' : t === 'drop' ? 'D' : String(++wn);
        html += '<div class="srow pending ' + t + '"><span class="n">' + label + '</span><span class="load">' +
          (st.cardio ? 'Cardio' : t === 'warmup' ? 'Warmup' : t === 'drop' ? 'Drop set' : 'Set ' + label) +
          '</span><span class="ring" aria-hidden="true"></span></div>';
      });

      if (st.cardio) {
        html += '<div class="entry c1"><div class="field"><label for="m' + i + '">Minutes</label><input id="m' + i + '" data-dm="' + i + '" inputmode="decimal" autocomplete="off" value="' + esc(d.m) + '"></div>' +
          '<button type="button" class="primary" data-a="addset" data-i="' + i + '">Add</button></div>';
      } else {
        html += '<div class="typesel" role="group" aria-label="Set type">' + TYPES.map(function (t) {
          return '<button type="button" class="tbtn ' + t[0] + '" data-a="settype" data-i="' + i + '" data-v="' + t[0] + '" aria-pressed="' + (d.type === t[0]) + '">' + t[1] + '</button>';
        }).join('') + '</div>' +
          '<div class="entry">' +
          '<div class="field"><label for="w' + i + '">Weight (' + state.unit + ')</label><input id="w' + i + '" data-dw="' + i + '" inputmode="decimal" autocomplete="off" value="' + esc(d.w) + '"></div>' +
          '<div class="field"><label for="r' + i + '">Reps</label><input id="r' + i + '" data-dr="' + i + '" inputmode="numeric" autocomplete="off" value="' + esc(d.r) + '"></div>' +
          '<button type="button" class="primary" data-a="addset" data-i="' + i + '">Add set</button></div>';
      }
      if (ui.err && ui.err.i === i) html += '<p class="err">' + esc(ui.err.msg) + '</p>';
      html += '</div>';
    });

    html += '<div class="addex"><div class="row"><div class="field"><label for="newex">Add exercise</label>' +
      '<input id="newex" autocomplete="off" value="' + esc(ui.newEx) + '"></div>' +
      '<button type="button" class="secondary" data-a="addex" style="align-self:flex-end">Add</button></div>' +
      '<label class="chk" style="margin-top:8px"><input type="checkbox" data-a="newcardio"' + (ui.newCardio ? ' checked' : '') + '> Cardio (log minutes instead of reps)</label></div>';

    html += '<div class="endrow"><button type="button" class="linkbtn danger mute' + (ui.armed === 'discard' ? ' armed' : '') + '" data-a="discard">' +
      (ui.armed === 'discard' ? 'Tap again to discard this workout' : 'Discard workout') + '</button></div>';
    return html;
  }

  /* ---------- calories burned (estimate: MET x body weight x hours) ---------- */
  var STRENGTH_MET = 4.0;
  function metFor(name) {
    var n = String(name).toLowerCase();
    if (/sprint/.test(n)) return 12;
    if (/skip|jump rope/.test(n)) return 11;
    if (/run|jog/.test(n)) return 9.8;
    if (/stair|step ?mill|climb/.test(n)) return 9;
    if (/hiit|circuit/.test(n)) return 8;
    if (/cycl|bike|spin/.test(n)) return 7.5;
    if (/row/.test(n)) return 7;
    if (/swim/.test(n)) return 7;
    if (/elliptic|cross.?trainer/.test(n)) return 5;
    if (/walk|hike/.test(n)) return 3.8;
    return 7;
  }
  function bodyKg() {
    if (state.bodyKg > 0) return state.bodyKg;
    if (state.calc && state.calc.kg > 0) return state.calc.kg;
    return 75;
  }
  function burnCalc(w, sets) {
    var kg = bodyKg();
    var total = 0, lines = [], cardio = {}, cardioMin = 0;
    sets.forEach(function (e) {
      if (!e.cardio) return;
      var k = key(e.ex);
      cardio[k] = cardio[k] || { name: e.ex, mins: 0 };
      cardio[k].mins += Number(e.mins) || 0;
    });
    Object.keys(cardio).forEach(function (k) {
      var c = cardio[k];
      cardioMin += c.mins;
      var kc = metFor(c.name) * kg * c.mins / 60;
      total += kc;
      lines.push({ label: c.name + ' \u00B7 ' + fmtMins(c.mins) + ' min', kcal: kc });
    });
    if (sets.some(function (e) { return !e.cardio; }) && w.start && w.end) {
      var sm = Math.max(0, (w.end - w.start) / 60000 - cardioMin);
      var kc2 = STRENGTH_MET * kg * sm / 60;
      total += kc2;
      lines.unshift({ label: 'Strength \u00B7 ' + Math.round(sm) + ' min', kcal: kc2 });
    }
    return { total: total, lines: lines, kg: kg, known: !!(state.bodyKg > 0 || (state.calc && state.calc.kg > 0)) };
  }
  function burnHTML(b) {
    if (!(b.total > 0)) return '';
    return '<div class="burn"><div class="stat"><span class="num">~' + fmtK(b.total) + '</span><span class="l">kcal burned (estimate)</span></div>' +
      b.lines.map(function (l) {
        return '<div class="nutrow"><span>' + esc(l.label) + '</span><span>' + fmtK(l.kcal) + ' kcal</span></div>';
      }).join('') +
      '<div class="field bw"><label for="bw">Your weight (' + state.unit + ')' + (b.known ? '' : ', assuming ' + fmtW(75) + ' ' + state.unit) + '</label>' +
      '<input id="bw" inputmode="decimal" autocomplete="off" value="' + (b.known ? fmtW(b.kg) : '') + '"></div></div>';
  }
  function burnLine(it, sets) {
    if (it.legacy) return '';
    var b = burnCalc(it, sets);
    return b.total > 0 ? '<p class="sub" style="margin:2px 0 6px">About ' + fmtK(b.total) + ' kcal burned (estimate)</p>' : '';
  }

  function summaryHTML(w) {
    var flags = analyze(state.entries);
    var all = state.entries.filter(function (e) { return e.wid === w.id; }).sort(cmpEntries);
    var groups = groupByEx(all);
    var lifted = all.filter(function (e) { return !e.cardio && e.type !== 'warmup'; });
    var vol = lifted.reduce(function (s, e) { return s + e.kg * e.reps; }, 0);
    var infos = groups.map(function (g) { return { g: g, p: exPRs(g.sets, flags) }; });
    var total = infos.reduce(function (s, x) { return s + x.p.lines.length; }, 0);

    var html = '<h2>' + esc(w.plan ? w.plan + ' complete' : 'Workout complete') + '</h2><div class="stats">' +
      '<div class="stat"><span class="num">' + fmtDur(w.end - w.start) + '</span><span class="l">Time</span></div>' +
      '<div class="stat"><span class="num">' + groups.length + '</span><span class="l">' + (groups.length === 1 ? 'Exercise' : 'Exercises') + '</span></div>' +
      '<div class="stat"><span class="num">' + lifted.length + '</span><span class="l">' + (lifted.length === 1 ? 'Set' : 'Sets') + '</span></div>' +
      '<div class="stat"><span class="num">' + Math.round(toDisp(vol)).toLocaleString('en-GB') + '</span><span class="l">Volume (' + state.unit + ')</span></div></div>';

    if (total > 0) {
      html += '<div class="banner pr" role="status"><div class="t">' + (total === 1 ? 'You hit a PR' : 'You hit ' + total + ' PRs') + '</div>';
      infos.forEach(function (x) {
        if (!x.p.lines.length) return;
        html += '<div class="bx">' + esc(x.g.name) + '</div>' + x.p.lines.map(function (l) { return '<p class="l">' + esc(l) + '</p>'; }).join('');
      });
      html += '</div>';
    } else {
      var bases = infos.filter(function (x) { return x.p.base; }).map(function (x) { return x.g.name; });
      html += '<div class="banner none" role="status"><div class="t">No PRs this workout</div><p class="l">' +
        (bases.length ? esc('First time logging ' + bases.join(', ') + ': that is now your baseline to beat.') : '') + '</p></div>';
    }
    if (total > 0) {
      var b2 = infos.filter(function (x) { return x.p.base; }).map(function (x) { return x.g.name; });
      if (b2.length) html += '<p class="sub" style="margin-top:10px">First time logging ' + esc(b2.join(', ')) + ': baseline set.</p>';
    }

    html += burnHTML(burnCalc(w, all));
    html += '<div class="recap"><h3>What you did</h3>' + recapRows(all, flags) + '</div>';

    if (ui.benchAsk === w.id) {
      html += '<div class="benchask"><h3>Save these as your benchmark?</h3>' +
        '<p class="sub">Next time you do these exercises you will see these sets to beat. Skip it after an off day and your last saved benchmark stays.</p>' +
        '<div class="benchbtns"><button type="button" class="primary" data-a="bench-yes">Save benchmark</button>' +
        '<button type="button" class="secondary" data-a="bench-no">Not this time</button></div></div>';
    } else if (ui.benchMsg) {
      html += '<p class="sub" style="margin-top:14px">' + esc(ui.benchMsg) + '</p>';
    }
    return html + '<div class="after"><button type="button" class="secondary" data-a="done">Done</button></div>' +
      (w.plan ? '' : ui.planSaved === w.id
        ? '<p class="sub" style="margin-top:12px">Saved to Plans.</p>'
        : '<div style="margin-top:8px"><button type="button" class="linkbtn" data-a="plan-fromworkout" data-id="' + esc(w.id) + '">Save this workout as a plan</button></div>');
  }

  function workoutHTML() {
    if (state.active) return activeHTML();
    if (ui.summary) {
      var w = state.workouts.filter(function (x) { return x.id === ui.summary; })[0];
      if (w) return summaryHTML(w);
    }
    return '';
  }

  /* ---------- Plans tab ---------- */
  function canonName(n) {
    var k = key(n);
    var known = state.entries.filter(function (en) { return key(en.ex) === k; })[0];
    return known ? known.ex : n;
  }
  function typeName(t) { return t === 'warmup' ? 'Warmup' : t === 'drop' ? 'Drop' : 'Working'; }
  // The planned sets of an exercise as a list of types, e.g. ['warmup', 'working', 'working', 'drop'].
  function planSlots(x) {
    if (x && x.types && x.types.length) return x.types.map(function (t) { return t === 'warmup' || t === 'drop' ? t : 'working'; });
    var out = [];
    for (var i = 0; i < ((x && x.sets) || 0); i++) out.push('working');
    return out;
  }
  function slotsLabel(types) {
    var c = { warmup: 0, working: 0, drop: 0 };
    types.forEach(function (t) { c[t === 'warmup' || t === 'drop' ? t : 'working']++; });
    if (!c.warmup && !c.drop) return c.working + (c.working === 1 ? ' set' : ' sets');
    var parts = [];
    if (c.warmup) parts.push(c.warmup + ' warmup');
    if (c.working) parts.push(c.working + ' working');
    if (c.drop) parts.push(c.drop + ' drop');
    return parts.join(', ');
  }
  function planSummary(p) {
    return p.exercises.map(function (x) {
      return x.name + (x.cardio ? ' (cardio)' : ' ' + slotsLabel(planSlots(x)));
    }).join(' \u00B7 ');
  }
  function planRow(p, full) {
    var acts = '';
    if (!state.active) acts += '<button type="button" class="primary" data-a="start" data-plan="' + esc(p.id) + '">Start</button>';
    if (full) {
      var armed = ui.armed === 'plan:' + p.id;
      acts += '<span><button type="button" class="linkbtn" data-a="plan-edit" data-id="' + esc(p.id) + '">Edit</button> ' +
        '<button type="button" class="linkbtn danger mute' + (armed ? ' armed' : '') + '" data-a="plan-del" data-id="' + esc(p.id) + '">' + (armed ? 'Tap again' : 'Delete') + '</button></span>';
    }
    return '<div class="plan"><div><div class="pname">' + esc(p.name) + '</div><div class="pex">' + esc(planSummary(p)) + '</div></div><div class="acts">' + acts + '</div></div>';
  }
  function plansHTML() {
    if (ui.edit) return editorHTML();
    var html = '<div class="wkhead"><h2 style="margin:0">Workout plans</h2><button type="button" class="primary" data-a="plan-new">New plan</button></div>' +

    if (ui.pf) {
      var d = ui.pf;
      return '<div class="card"><h3>' + (has ? 'Edit profile' : 'Set up your profile') + '</h3>' +
        '<div class="field"><label for="pf-name">Name</label><input id="pf-name" data-pf="name" autocomplete="given-name" maxlength="40" value="' + esc(d.name) + '"></div>' +
        '<div class="frow" style="margin-top:12px"><div class="field"><label for="pf-age">Age</label><input id="pf-age" data-pf="age" inputmode="numeric" autocomplete="off" value="' + esc(d.age) + '"></div>' +
        '<div class="field"><label for="pf-gender">Gender</label><select id="pf-gender" data-pf="gender"><option value=""></option>' + genderOpts(d.gender) + '</select></div></div>' +
        '<div class="field" style="margin-top:12px"><label for="pf-wt">Weight (' + state.unit + ')</label><input id="pf-wt" data-pf="wt" inputmode="decimal" autocomplete="off" value="' + esc(d.wt) + '"></div>' +
        (d.err ? '<p class="err">' + esc(d.err) + '</p>' : '') +
        '<div class="benchbtns" style="margin-top:12px"><button type="button" class="primary" data-a="pf-save">Save</button>' +
        (has ? '<button type="button" class="secondary" data-a="pf-cancel">Cancel</button>' : '') + '</div></div>';
    }
    return '<div class="card"><h2 class="pname">' + esc(c.name) + '</h2>' +
      '<div class="prow"><span>Age</span><span>' + (c.age ? c.age : '-') + '</span></div>' +
      '<div class="prow"><span>Gender</span><span>' + (genderName(c.gender) || '-') + '</span></div>' +
      '<div class="prow"><span>Weight</span><span>' + (state.bodyKg > 0 ? fmtW(state.bodyKg) + ' ' + state.unit : '-') + '</span></div>' +
      '<div class="prow"><span>Email</span><span>' + esc((user && user.email) || '') + '</span></div>' +
      '<div class="benchbtns" style="margin-top:12px"><button type="button" class="secondary" data-a="pf-edit">Edit profile</button></div></div>';
  }
  function profileAction(a) {
    var c = state.calc;
    if (a === 'pf-edit') ui.pf = { name: c.name || '', age: c.age ? String(c.age) : '', gender: c.gender || '', wt: state.bodyKg > 0 ? fmtW(state.bodyKg) : '', err: '' };
    else if (a === 'pf-cancel') ui.pf = null;
    else if (a === 'pf-save') {
      var d = ui.pf, r = readProfile(d.name, d.age, d.gender, d.wt, state.unit, 'pf-');
      if (r.err) { d.err = r.err; ui.focus = '#' + r.id; render(); return; }
      c.name = r.name; c.age = r.age; c.gender = r.gender;
      if (r.gender !== 'o') c.sex = r.gender;
      state.bodyKg = r.kg;
      ui.pf = null; persist();
    }
    render();
  }
  function profileHTML() {
    if (ui.policy) return '<div class="card policy">' + policyPage('auth-policyback') + '</div>';
    var h = '<h2 class="pagetitle">Profile</h2>' + profileCard() + recapHTML();
    var rec = recordsHTML();
    h += rec ? '<h2 class="pagetitle" style="margin-top:28px">Records</h2>' + rec : '<p class="sub" style="margin-top:20px">Your records will show up here after you finish a workout.</p>';
    return h + '<div class="dzone" style="margin-top:20px"><button type="button" class="linkbtn mute" data-a="auth-policy">Privacy Policy</button></div>' + footHTML();
  }

  /* ---------- render ---------- */
  function renderLifts() {
    var names = {};
    COMMON.forEach(function (n) { names[key(n)] = n; });
    state.entries.forEach(function (e) { names[key(e.ex)] = e.ex; });
    var dl = $('lifts');
    dl.innerHTML = '';
    Object.keys(names).sort().forEach(function (k) {
      var o = document.createElement('option');
      o.value = names[k];
      dl.appendChild(o);
    });
  }
  function render() {
    var signedIn = !!(user && state.loaded) && !auth.recovery;
    $('app').hidden = !signedIn;
    $('acct').hidden = !signedIn;
    $('auth').hidden = signedIn;
    if (!signedIn) { renderAuth(); return; }
    var nt = $('notice');
    if (nt) nt.innerHTML = noticeHTML();
    var showWk = !!state.active || !!(ui.summary && state.workouts.some(function (w) { return w.id === ui.summary; }));
    if (ui.tab === 'workout' && !showWk) ui.tab = 'plans';
    $('tab-workout').hidden = !showWk;
    document.querySelectorAll('[data-a="unit"]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.unit === state.unit));
    });
    ['workout', 'plans', 'calendar', 'meals', 'profile'].forEach(function (t) {
      var b = $('tab-' + t);
      b.setAttribute('aria-selected', String(ui.tab === t));
      b.setAttribute('aria-controls', 'panel');
      b.innerHTML = t.charAt(0).toUpperCase() + t.slice(1) + (t === 'workout' && state.active ? '<span class="live" title="Workout in progress"></span>' : '');
    });
    $('panel').innerHTML = ui.tab === 'workout' ? workoutHTML() : ui.tab === 'plans' ? plansHTML() : ui.tab === 'calendar' ? calendarHTML() : ui.tab === 'meals' ? mealsHTML() : profileHTML();
    var selTab = $('tab-' + ui.tab);
    if (selTab && selTab.parentNode && selTab.offsetWidth) {
      var nv = selTab.parentNode;
      if (selTab.offsetLeft < nv.scrollLeft || selTab.offsetLeft + selTab.offsetWidth > nv.scrollLeft + nv.clientWidth) nv.scrollLeft = Math.max(0, selTab.offsetLeft - 16);
    }
    if (ui.focus) {
      var el = $('panel').querySelector(ui.focus);
      if (el) el.focus();
      ui.focus = null;
    }
  }

  /* ---------- actions ---------- */
  function isCardioName(k) {
    return state.entries.some(function (e) { return e.cardio && key(e.ex) === k; }) ||
      state.plans.some(function (p) { return p.exercises.some(function (x) { return x.cardio && key(x.name) === k; }); });
  }
  function startWorkout(planId) {
    var plan = planId ? state.plans.filter(function (p) { return p.id === planId; })[0] : null;
    state.active = { id: uid(), start: Date.now(), date: today(), exercises: [], targets: {}, cardio: {}, plan: plan ? plan.name : null, planId: plan ? plan.id : null };
    ui.summary = null; ui.drafts = {}; ui.err = null; ui.newEx = ''; ui.newCardio = false; ui.benchAsk = null; ui.benchMsg = '';
    if (plan) {
      plan.exercises.forEach(function (x) {
        var k = key(x.name);
        if (state.active.exercises.some(function (n) { return key(n) === k; })) return;
        state.active.exercises.push(x.name);
        if (x.cardio) { state.active.cardio[k] = true; state.active.targets[k] = { sets: 1 }; }
        else state.active.targets[k] = { sets: planSlots(x).length, types: planSlots(x) };
        prefill(x.name);
      });
    }
    ui.tab = 'workout';
    persist();
    ui.focus = plan ? null : '#newex';
    render();
    window.scrollTo(0, 0);
  }
  function addExercise() {
    var name = ui.newEx.trim().replace(/\s+/g, ' ');
    if (!name) { ui.err = { i: -2, msg: '' }; $('newex').focus(); return; }
    var k = key(name);
    var known = state.entries.filter(function (e) { return key(e.ex) === k; })[0];
    if (known) name = known.ex;
    var idx = -1;
    state.active.exercises.forEach(function (n, i) { if (key(n) === k) idx = i; });
    if (idx === -1) {
      state.active.exercises.push(name);
      idx = state.active.exercises.length - 1;
      if (ui.newCardio || isCardioName(k)) state.active.cardio[k] = true;
      prefill(name);
    }
    ui.newEx = ''; ui.newCardio = false; ui.err = null;
    persist();
    ui.focus = state.active.cardio[k] ? '[data-dm="' + idx + '"]' : '[data-dw="' + idx + '"]';
    render();
  }
  function addSet(i) {
    var a = state.active;
    var name = a.exercises[i];
    var k = key(name);
    var d = getDraft(k);
    if (a.cardio && a.cardio[k]) {
      var m = Number(String(d.m).replace(',', '.'));
      if (!(m > 0 && m <= 1000)) { ui.err = { i: i, msg: 'Enter the minutes you did.' }; ui.focus = '[data-dm="' + i + '"]'; render(); return; }
      state.entries.push({ id: uid(), ex: name, kg: 0, reps: 0, mins: Math.round(m * 10) / 10, cardio: true, type: 'working', date: a.date, ts: Date.now(), wid: a.id });
      ui.err = null;
      persist();
      ui.focus = '[data-dm="' + i + '"]';
      render();
      return;
    }
    var w = parseFloat(String(d.w).replace(',', '.'));
    var rs = String(d.r).trim();
    var r = parseInt(rs, 10);
    if (!isFinite(w) || w < 0) { ui.err = { i: i, msg: 'Enter a weight of 0 or more in ' + state.unit + '.' }; ui.focus = '[data-dw="' + i + '"]'; render(); return; }
    if (!/^\d+$/.test(rs) || r < 1 || r > 100) { ui.err = { i: i, msg: 'Enter reps as a whole number from 1 to 100.' }; ui.focus = '[data-dr="' + i + '"]'; render(); return; }
    state.entries.push({ id: uid(), ex: name, kg: Math.round(toKg(w) * 10000) / 10000, reps: r, type: d.type || 'working', date: a.date, ts: Date.now(), wid: a.id });
    if (a.targets && a.targets[k]) d.manual = false;
    ui.err = null;
    persist();
    ui.focus = '[data-dr="' + i + '"]';
    render();
  }
  function finishWorkout() {
    var a = state.active;
    var n = state.entries.filter(function (e) { return e.wid === a.id; }).length;
    if (!n) { ui.err = { i: -1, msg: 'Log at least one set before finishing, or discard the workout.' }; render(); return; }
    state.workouts.push({ id: a.id, date: a.date, start: a.start, end: Date.now(), plan: a.plan || null, planId: a.planId || null });
    state.active = null;
    ui.summary = a.id; ui.drafts = {}; ui.err = null; ui.armed = null; ui.benchAsk = a.id; ui.benchMsg = '';
    persist();
    render();
    window.scrollTo(0, 0);
  }
  function benchAction(a) {
    var id = ui.summary;
    if (a === 'bench-yes' && id) {
      var w = state.workouts.filter(function (x) { return x.id === id; })[0];
      var sets = state.entries.filter(function (e) { return e.wid === id && e.type !== 'warmup'; }).sort(cmpEntries);
      groupByEx(sets).forEach(function (g) {
        state.bench[g.k] = {
          name: g.name, date: w ? w.date : today(),
          sets: g.sets.map(function (e) { return { kg: e.kg, reps: e.reps, mins: e.mins || 0, cardio: !!e.cardio, type: typeOf(e) }; })
        };
      });
      ui.benchMsg = 'Saved as your benchmark.';
    } else {
      ui.benchMsg = 'Benchmark left as it was.';
    }
    ui.benchAsk = null;
    persist();
    render();
  }
  function armThen(token, fn) {
    if (ui.armed === token) { ui.armed = null; fn(); return; }
    ui.armed = token;
    render();
    setTimeout(function () { if (ui.armed === token) { ui.armed = null; render(); } }, 3000);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-a]');
    if (!t) return;
    var a = t.dataset.a;
    if (a === 'unit') {
      if (t.dataset.unit === state.unit) return;
      var old = state.unit;
      Object.keys(ui.drafts).forEach(function (k) {
        var v = parseFloat(String(ui.drafts[k].w).replace(',', '.'));
        if (isFinite(v)) {
          var kg = old === 'kg' ? v : v / LB;
          state.unit = t.dataset.unit;
          ui.drafts[k].w = fmtW(kg);
          state.unit = old;
        }
      });
      state.unit = t.dataset.unit;
      persist(); render();
    } else if (a === 'tab') {
      ui.tab = t.dataset.tab; ui.err = null; render();
    } else if (a === 'start') startWorkout(t.dataset.plan);
    else if (a.indexOf('auth-') === 0) authAction(a, t);
    else if (a.indexOf('pf-') === 0) profileAction(a);
    else if (a.indexOf('rc-') === 0) recapAction(a, t);
    else if (a.indexOf('tgt-') === 0) tgtAction(a, t);
    else if (a.indexOf('scan-') === 0) scanAction(a);
    else if (a.indexOf('calc-') === 0) calcAction(a, t);
    else if (a.indexOf('meal-') === 0) mealAction(a, t);
    else if (a.indexOf('cal-') === 0) calAction(a, t);
    else if (a.indexOf('plan-') === 0) planAction(a, t);
    else if (a === 'settype') { var sd = getDraft(key(state.active.exercises[+t.dataset.i])); sd.type = t.dataset.v; sd.manual = true; render(); }
    else if (a === 'newcardio') { ui.newCardio = t.checked; }
    else if (a.indexOf('bench-') === 0) benchAction(a);
    else if (a === 'addex') addExercise();
    else if (a === 'addset') addSet(+t.dataset.i);
    else if (a === 'finish') finishWorkout();
    else if (a === 'done') { ui.summary = null; render(); }
    else if (a === 'rmset') {
      state.entries = state.entries.filter(function (e) { return e.id !== t.dataset.id; });
      persist(); render();
    } else if (a === 'rmex') {
      state.active.exercises.splice(+t.dataset.i, 1);
      persist(); render();
    } else if (a === 'discard') {
      armThen('discard', function () {
        var id = state.active.id;
        state.entries = state.entries.filter(function (e) { return e.wid !== id; });
        state.active = null; ui.drafts = {}; ui.err = null;
        persist(); render();
      });
    } else if (a === 'sel') { ui.sel = t.dataset.key; render(); }
    else if (a === 'togglewk') { ui.open[t.dataset.id] = !ui.open[t.dataset.id]; ui.focus = '[data-a="togglewk"][data-id="' + t.dataset.id + '"]'; render(); }
    else if (a === 'morehist') { ui.histShown += 15; render(); }
    else if (a === 'delwk') {
      var id = t.dataset.id;
      armThen('wk:' + id, function () {
        state.entries = state.entries.filter(function (e) {
          return id.indexOf('d:') === 0 ? !(!e.wid && e.date === id.slice(2)) : e.wid !== id;
        });
        state.workouts = state.workouts.filter(function (w) { return w.id !== id; });
        persist(); render();
      });
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.au !== undefined) { auth[t.dataset.au] = t.value; return; }
    if (t.dataset && t.dataset.pf !== undefined && ui.pf) { ui.pf[t.dataset.pf] = t.value; return; }
    if (t.id === 'del-confirm') { ui.delText = t.value; var dg = $('del-go'); if (dg) dg.disabled = t.value.trim().toUpperCase() !== 'DELETE'; return; }
    if (t.dataset.mx !== undefined) { ui.mealDraft.d[t.dataset.mx] = t.value; return; }
    if (t.dataset.dm !== undefined && state.active) { getDraft(key(state.active.exercises[+t.dataset.dm])).m = t.value; return; }
    if (t.dataset.sg !== undefined && ui.scan) { ui.scan.grams = t.value; applyScan(); return; }
    if (t.dataset.cd !== undefined) { ui.calcDraft[t.dataset.cd] = t.value; return; }
    if (t.dataset.md !== undefined) { ui.mealDraft[t.dataset.md] = t.value; return; }
    if (t.id === 'newex') { ui.newEx = t.value; return; }
    if (t.id === 'pname' && ui.edit) { ui.edit.name = t.value; return; }
    if (t.dataset.pe !== undefined && ui.edit) { ui.edit.exercises[+t.dataset.pe][t.dataset.f] = t.value; return; }
    if (t.dataset.dw !== undefined && state.active) getDraft(key(state.active.exercises[+t.dataset.dw])).w = t.value;
    else if (t.dataset.dr !== undefined && state.active) getDraft(key(state.active.exercises[+t.dataset.dr])).r = t.value;
  });

  document.addEventListener('submit', function (ev) {
    if (ev.target && ev.target.id === 'authform') { ev.preventDefault(); authSubmit(); }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var t = ev.target;
    if (t.id === 'newex') { ev.preventDefault(); addExercise(); }
    else if (t.dataset && t.dataset.cd !== undefined) { ev.preventDefault(); calcAction('calc-run', t); }
    else if (t.dataset && t.dataset.md !== undefined) { ev.preventDefault(); mealEnter(t); }
    else if (t.dataset && t.dataset.dw !== undefined) { ev.preventDefault(); var r = document.querySelector('[data-dr="' + t.dataset.dw + '"]'); if (r) r.focus(); }
    else if (t.dataset && t.dataset.dr !== undefined) { ev.preventDefault(); addSet(+t.dataset.dr); }
    else if (t.dataset && t.dataset.dm !== undefined) { ev.preventDefault(); addSet(+t.dataset.dm); }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'au-agree') { auth.agree = t.checked; return; }
    if (t.id === 'bw' || t.id === 'tbw') {
      var bn = Number(String(t.value).trim().replace(',', '.'));
      state.bodyKg = isFinite(bn) && bn > 20 ? toKg(bn) : 0;
      persist(); render(); return;
    }
    if (t.dataset && t.dataset.sg !== undefined && ui.scan && ui.scanAll) { render(); return; }
    if (t.dataset && t.dataset.tg !== undefined) setTarget(t.dataset.tg, t.value);
  });

  setInterval(function () {
    var el = $('elapsed');
    if (el && state.active) el.textContent = fmtDur(Date.now() - state.active.start);
  }, 1000);

  /* ---------- start ---------- */
  render();
  initAuth();
})();
</script>
</body>
</html>
