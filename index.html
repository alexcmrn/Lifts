<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifts</title>
<meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- Pinned with an integrity hash: to upgrade, change the version and recompute the sha384 of the new file. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"
  integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Lifts</h1></div>
    <div id="acct" hidden><button type="button" class="linkbtn mute" data-a="auth-out">Log out</button></div>
  </header>
  <p class="syncerr" id="syncmsg" role="alert" hidden></p>

  <div id="auth" hidden></div>
  <div id="app" hidden>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-a="tab" data-tab="workout" id="tab-workout">Workout</button>
      <button type="button" role="tab" data-a="tab" data-tab="plans" id="tab-plans">Plans</button>
      <button type="button" role="tab" data-a="tab" data-tab="calendar" id="tab-calendar">Calendar</button>
      <button type="button" role="tab" data-a="tab" data-tab="meals" id="tab-meals">Meals</button>
      <button type="button" role="tab" data-a="tab" data-tab="friends" id="tab-friends">Friends</button>
      <button type="button" role="tab" data-a="tab" data-tab="profile" id="tab-profile">Profile</button>
    </nav>
    <div id="notice"></div>
    <main id="panel" role="tabpanel"></main>
  </div>
</div>

<!-- The photo share sheet lives outside the page so it can cover the tab bar. -->
<div id="sheet"></div>
<script src="app.js"></script>
</body>
</html>
