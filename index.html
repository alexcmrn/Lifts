<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #EDEFF1;
  --surface: #FFFFFF;
  --field: #F5F6F8;
  --ink: #161B22;
  --mute: #5B6573;
  --line: #D3D8DE;
  --pr: #D7322B;
  --pr-ink: #FFFFFF;
  --accent: #1F5FBF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161B;
    --surface: #1A2027;
    --field: #232B34;
    --ink: #EEF1F4;
    --mute: #9AA4B0;
    --line: #2E3843;
    --pr: #FF5A4F;
    --pr-ink: #1A0907;
    --accent: #6AA3FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161B;
  --surface: #1A2027;
  --field: #232B34;
  --ink: #EEF1F4;
  --mute: #9AA4B0;
  --line: #2E3843;
  --pr: #FF5A4F;
  --pr-ink: #1A0907;
  --accent: #6AA3FF;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 56px; }
h1, h2, h3, .num {
  font-family: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
h1 { font-size: 2.6rem; line-height: 1; margin: 0; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 1.7rem; line-height: 1.1; margin: 0 0 10px; font-weight: 600; }
h3 { font-size: 1.4rem; line-height: 1.1; margin: 0; font-weight: 600; }
p { margin: 0; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.status { margin: 6px 0 0; font-size: .85rem; color: var(--mute); }

.unit { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.unit button {
  font: 600 1.05rem 'Barlow Condensed', sans-serif;
  min-width: 52px; height: 40px; border: 0; background: transparent; color: var(--mute); cursor: pointer;
}
.unit button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

nav.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
nav.tabs button {
  font: 600 1.35rem 'Barlow Condensed', sans-serif; background: none; border: 0; cursor: pointer;
  color: var(--mute); padding: 8px 0 9px; margin-bottom: -1px; border-bottom: 4px solid transparent;
  display: inline-flex; align-items: center; gap: 8px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pr); }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--pr); display: inline-block; }

button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.primary, .submit {
  border: 0; border-radius: 8px; cursor: pointer; background: var(--ink); color: var(--bg);
  font: 600 1.3rem 'Barlow Condensed', sans-serif; letter-spacing: .02em; height: 50px; padding: 0 22px;
}
.primary:active, .submit:active { transform: translateY(1px); }
.submit { width: 100%; height: 58px; font-size: 1.5rem; }
.secondary {
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); color: var(--ink);
  font: 600 1.15rem 'Barlow Condensed', sans-serif; height: 48px; padding: 0 18px;
}
.linkbtn { font: 500 .95rem 'Barlow', sans-serif; background: none; border: 0; padding: 6px 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
.linkbtn.danger.armed { color: var(--pr); font-weight: 600; }
.linkbtn.mute { color: var(--mute); }

.empty { color: var(--mute); max-width: 52ch; }
.sub { color: var(--mute); font-size: .92rem; }

/* idle workout */
.idle { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 16px 18px; }
.idle p { margin-bottom: 16px; color: var(--mute); }

/* active workout */
.wkhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.elapsed { font-size: 3rem; line-height: 1; font-weight: 700; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; margin-top: 12px; }
.exhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.last { color: var(--mute); font-size: .9rem; margin: 2px 0 8px; }
.srow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.srow .n { width: 1.6em; color: var(--mute); font: 600 1.1rem 'Barlow Condensed', sans-serif; }
.srow .load { font: 600 1.35rem 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
.srow .linkbtn { margin-left: auto; color: var(--mute); }
.entry { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: .85rem; color: var(--mute); font-weight: 500; }
.field input {
  height: 48px; width: 100%; padding: 0 12px; font: 500 1.2rem 'Barlow', sans-serif;
  color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px;
}
.err { color: var(--pr); font-weight: 500; margin-top: 8px; font-size: .95rem; }
.addex { margin-top: 18px; }
.addex .row { display: flex; gap: 10px; }
.addex .field { flex: 1; }
.endrow { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.endrow .linkbtn { align-self: center; }

/* summary */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 18px; }
.stat .num { font-size: 2rem; line-height: 1; font-weight: 700; display: block; }
.stat span.l { font-size: .85rem; color: var(--mute); }
.banner { border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-left-width: 6px; }
.banner.base { border-left-color: var(--accent); }
.banner.none { border-left-color: var(--mute); }
.banner .t { font: 700 2.2rem/1.05 'Barlow Condensed', sans-serif; }
.banner.none .t { font-size: 1.6rem; font-weight: 600; }
.banner .bx { font: 600 1.25rem 'Barlow Condensed', sans-serif; margin-top: 12px; }
.banner p.l { margin-top: 1px; }
.banner.pr { background: var(--pr); color: var(--pr-ink); border-color: var(--pr); animation: stamp .24s ease-out; }
@keyframes stamp { from { transform: scale(1.1) rotate(-1.2deg); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .banner.pr { animation: none; } }
.recap { margin-top: 22px; }
.recap h3 { margin-bottom: 6px; }
.exrow { padding: 10px 0; border-top: 1px solid var(--line); }
.exrow .name { font: 600 1.25rem 'Barlow Condensed', sans-serif; margin-right: 8px; }
.setline { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 2px; }
.setline .s { font: 600 1.15rem 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
.chip { font: 600 .78rem 'Barlow', sans-serif; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); margin-left: 6px; vertical-align: 2px; }
.chip.pr { background: var(--pr); border-color: var(--pr); color: var(--pr-ink); }
.after { margin-top: 20px; }

/* records */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: .88rem; color: var(--mute); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.r, td.r { text-align: right; padding-right: 0; }
td .num { font-size: 1.3rem; font-weight: 600; }
td small { color: var(--mute); font-size: .85rem; }
.liftbtn {
  font: 600 1.3rem 'Barlow Condensed', sans-serif; background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ink); text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px;
}
tr.sel .liftbtn { text-decoration-color: var(--pr); text-decoration-thickness: 3px; }
.detail { margin-top: 30px; }
.detail h3.big { font-size: 1.9rem; margin-bottom: 10px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .cap { margin-top: 2px; font-size: .88rem; color: var(--mute); }
.sect { margin-top: 24px; }
.sect h4 { margin: 0 0 6px; font: 600 1.25rem 'Barlow Condensed', sans-serif; }
.rm { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.rm div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.rm .num { font-size: 1.5rem; font-weight: 600; line-height: 1.1; display: block; }
.rm small { color: var(--mute); }
.tl { padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.tl .d { color: var(--mute); font-size: .9rem; min-width: 6.5em; }
.tl .s { font: 600 1.2rem 'Barlow Condensed', sans-serif; }

/* history */
.wk { padding: 14px 0 6px; border-top: 1px solid var(--line); }
.wkh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.wkh h3 { margin-right: auto; }
.wkh .sub { flex-basis: 100%; order: 3; }
.wkh .linkbtn { order: 2; }
.more { margin-top: 12px; }
.wkbtn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 10px 0; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
.wkmain { display: flex; flex-direction: column; min-width: 0; }
.wkt { font: 600 1.4rem/1.15 'Barlow Condensed', sans-serif; }
.wkside { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.chev { color: var(--mute); font-size: 1.1rem; width: 1em; text-align: center; }
.wkdel { padding: 6px 0 8px; }
nav.tabs { overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex-shrink: 0; white-space: nowrap; }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.weeknav h2 { margin: 0; font-size: 1.6rem; }
.wnbtns { display: flex; gap: 6px; }
.iconbtn { height: 44px; min-width: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 600 1.2rem 'Barlow Condensed', sans-serif; cursor: pointer; }
.drow { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.dlabel { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; gap: 2px; }
.dname { font-size: .85rem; color: var(--mute); font-weight: 500; }
.dnum { font: 700 1.9rem/1 'Barlow Condensed', sans-serif; }
.drow.today .dnum { color: var(--pr); }
.dbody { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sitem { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.sname { font: 600 1.3rem/1.1 'Barlow Condensed', sans-serif; }
.sitem .chip { margin-left: 0; }
.acts2 { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.primary.small { height: 38px; font-size: 1.1rem; padding: 0 16px; }
.chip.done { border-color: var(--accent); color: var(--accent); }
.picker { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.picker .secondary { height: 44px; text-align: left; }
.chk { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.chk input { width: 20px; height: 20px; }
.addbtn { align-self: flex-start; }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.mh { text-align: center; font-size: .8rem; color: var(--mute); font-weight: 500; padding: 2px 0 4px; }
.cell { min-height: 52px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; padding: 6px 0 0; font: 600 1.2rem/1 'Barlow Condensed', sans-serif; }
.cell.today { box-shadow: inset 0 -3px 0 var(--pr); }
.cell[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dots { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; min-height: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.done { background: var(--accent); }
.dot.pr { background: var(--pr); }
.dot.plan { box-sizing: border-box; border: 1.5px solid var(--mute); }
.cell[aria-pressed="true"] .dot.done { background: var(--bg); }
.cell[aria-pressed="true"] .dot.plan { border-color: var(--bg); }
.dayd { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.dayd h3 { font-size: 1.7rem; margin-bottom: 2px; }
.dayd .wk { padding: 0; border-top: 1px solid var(--line); }
.dot.meal { border-radius: 2px; background: var(--mute); }
.cell[aria-pressed="true"] .dot.meal { background: var(--bg); }
.mform { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
.mform .wide { grid-column: 1 / -1; }
.mform .submit { grid-column: 1 / -1; height: 54px; font-size: 1.4rem; margin-top: 4px; }
.mform .err { grid-column: 1 / -1; margin: 0; }
.meal { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.mn { display: flex; flex-direction: column; min-width: 0; }
.mname { font: 600 1.3rem/1.15 'Barlow Condensed', sans-serif; }
.cell { min-height: 60px; }
.kc { font: 600 .62rem/1 'Barlow Condensed', sans-serif; color: var(--mute); white-space: nowrap; max-width: 100%; overflow: hidden; }
.kc.over { color: var(--pr); }
.cell[aria-pressed="true"] .kc:not(.over) { color: var(--bg); opacity: .85; }
.tbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 2px; }
.tbar i { display: block; height: 100%; background: var(--accent); }
.tbar i.over { background: var(--pr); }
.tleft { margin: 4px 0 0; }
.calclink { display: block; margin: -6px 0 14px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 6px 0 18px; display: flex; flex-direction: column; gap: 12px; }
.calc h3 { margin: 0; }
.crow { display: flex; flex-wrap: wrap; gap: 10px; }
.cfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; }
.actl { display: flex; flex-direction: column; gap: 6px; }
.actbtn { text-align: left; display: flex; flex-direction: column; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); cursor: pointer; font: inherit; }
.actbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.actbtn .an { font: 600 1.15rem/1.1 'Barlow Condensed', sans-serif; }
.cstats { grid-template-columns: 1fr 1fr; margin: 0; }
.calc .secondary { height: 42px; }
.scanbox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 4px 0 12px; display: flex; flex-direction: column; gap: 8px; }
.sgrow { display: flex; gap: 12px; align-items: flex-end; }
.sgrow .field { flex: 1; }
.scanov { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.scanov[hidden] { display: none; }
.scansheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 100%; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.scansheet h3 { margin: 0; }
.scanvid { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; border-radius: 10px; }
.scanman { display: flex; gap: 10px; align-items: flex-end; }
.scanman .field { flex: 1; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 14px; }
.trow label { font-size: .9rem; color: var(--mute); font-weight: 500; }
.trow input { width: 120px; height: 44px; padding: 0 12px; font: 500 1.1rem 'Barlow', sans-serif; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; text-align: right; }
@media (max-width: 420px) { .mform { grid-template-columns: 1fr 1fr; } }

/* plans */
.plans { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.plan .pname { font: 600 1.5rem/1.1 'Barlow Condensed', sans-serif; }
.plan .pex { color: var(--mute); font-size: .92rem; margin-top: 3px; }
.plan .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.idle .plans { margin-top: 0; gap: 0; }
.idle .plan { background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 12px 0; }
.tgt { font-weight: 600; margin: 2px 0 0; }
.wkright { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
nav.tabs button[hidden] { display: none; }
.pe-row { display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: end; padding: 12px 0; border-top: 1px solid var(--line); }
.pe-row .nm { grid-column: 1 / -1; }
.pe-act { display: flex; gap: 14px; justify-content: flex-end; align-items: center; height: 48px; }
.peactions { display: flex; gap: 10px; margin-top: 22px; }

@media (max-width: 420px) {
  h1 { font-size: 2.2rem; }
  .stats { grid-template-columns: 1fr 1fr; row-gap: 14px; }
  .entry { grid-template-columns: 1fr 1fr; }
  .entry .primary { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Lifts</h1>
      
    </div>

  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-a="tab" data-tab="workout" id="tab-workout">Workout</button>
    <button type="button" role="tab" data-a="tab" data-tab="plans" id="tab-plans">Plans</button>
    <button type="button" role="tab" data-a="tab" data-tab="calendar" id="tab-calendar">Calendar</button>
    <button type="button" role="tab" data-a="tab" data-tab="meals" id="tab-meals">Meals</button>
    <button type="button" role="tab" data-a="tab" data-tab="records" id="tab-records">Records</button>
    
  </nav>


  <main id="panel" role="tabpanel"></main>
</div>

<script>
(function () {
  'use strict';

  var LB = 2.20462262;
  var EPS = 0.001;
  var LS_KEY = 'gymlog.v1';
  var COMMON = ['Squat', 'Bench press', 'Deadlift', 'Overhead press', 'Barbell row', 'Front squat',
    'Romanian deadlift', 'Incline bench press', 'Pull-up', 'Dip', 'Hip thrust', 'Lat pulldown'];
  var REP_TARGETS = [1, 3, 5, 8, 10];

  var state = { entries: [], workouts: [], plans: [], schedule: [], meals: [], calTarget: 0, calc: { sex: 'm', imp: false, act: 2, goal: 'lose', age: null, cm: null, kg: null }, active: null, unit: 'kg' };
  var ui = { tab: 'plans', sel: null, summary: null, drafts: {}, newEx: '', err: null, armed: null, histShown: 15, focus: null, edit: null, planSaved: null, open: {}, month: null, selDay: null, addDay: null, repeat: false, mealDay: null, mealErr: '', mealDraft: { name: '', kcal: '', p: '', c: '', f: '' }, calcOpen: false, calcShown: false, calcErr: '', calcDraft: { age: '', h: '', hin: '', w: '' }, scan: null };
  var remoteRef = null;
  var writeQueue = Promise.resolve();

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function key(name) { return String(name).trim().toLowerCase().replace(/\s+/g, ' '); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function toDisp(kg) { return state.unit === 'kg' ? kg : kg * LB; }
  function toKg(v) { return state.unit === 'kg' ? v : v / LB; }
  function fmtNum(v) { return String(+v.toFixed(state.unit === 'kg' ? 2 : 1)); }
  function fmtW(kg) { return fmtNum(toDisp(kg)); }
  function fmtDate(s, long) {
    var d = new Date(s + 'T00:00:00');
    var opts = { day: 'numeric', month: 'short' };
    if (long) opts.weekday = 'short';
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString('en-GB', opts);
  }
  function fmtDur(ms) {

  }

  /* ---------- storage ---------- */
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.entries)) {
          state.entries = d.entries;
          state.workouts = Array.isArray(d.workouts) ? d.workouts : [];
          state.plans = Array.isArray(d.plans) ? d.plans : [];
          state.schedule = Array.isArray(d.schedule) ? d.schedule : [];
          state.meals = Array.isArray(d.meals) ? d.meals : [];
          state.calTarget = +d.calTarget > 0 ? +d.calTarget : 0;
          if (d.calc && typeof d.calc === 'object') state.calc = Object.assign(state.calc, d.calc);
          state.active = d.active || null;
          if (d.unit === 'kg' || d.unit === 'lb') state.unit = d.unit;

  }
  function saveLocal() {

  }
  function setStatus(synced) {
    /* save status text removed */
  }

    var payload = JSON.parse(JSON.stringify({ entries: state.entries, workouts: state.workouts, plans: state.plans, schedule: state.schedule, meals: state.meals, calTarget: state.calTarget, calc: state.calc, active: state.active, unit: state.unit }));

      .then(function () { return remoteRef.set(payload); })

  function mergeById(a, b) {
    var seen = {}, out = [];
    (a || []).concat(b || []).forEach(function (x) {
      if (x && !seen[x.id]) { seen[x.id] = 1; out.push(x); }
    });
    return out;
  }
  function initRemote() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (res) {
      var db = res[0], user = res[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        var ref = db.doc('data/users/' + id + '/gymlog');
        return ref.get().then(function (snap) {
          if (snap.exists) {
            var d = JSON.parse(JSON.stringify(snap.data()));
            if (d && Array.isArray(d.entries)) {
              state.entries = mergeById(d.entries, state.entries);
              state.workouts = mergeById(d.workouts, state.workouts);
              state.plans = mergeById(d.plans, state.plans);
              state.schedule = mergeById(d.schedule, state.schedule);
              state.meals = mergeById(d.meals, state.meals);
              if (+d.calTarget > 0) state.calTarget = +d.calTarget;
              if (d.calc && typeof d.calc === 'object') state.calc = Object.assign(state.calc, d.calc);
              if (!state.active && d.active && !state.workouts.some(function (w) { return w.id === d.active.id; })) state.active = d.active;
              if (d.unit === 'kg' || d.unit === 'lb') state.unit = d.unit;

          }
          remoteRef = ref;
          setStatus(true);
          persist();
          render();
        });
      });
    }).catch(function () { /* stay on device storage */ });
  }

  /* ---------- PR analysis ---------- */
  // Walks every set in date order. A lift's first session is its baseline, so nothing in it counts as a PR.
  function analyze(entries) {
    var out = {};
    var per = {};
    entries.slice().sort(cmpEntries).forEach(function (e) {
      var k = key(e.ex);
      var s = per[k] || (per[k] = { base: grp(e), maxKg: -1, maxE: -1, sets: [] });
      var res = { first: grp(e) === s.base, types: [] };
      var ee = e1rm(e.kg, e.reps);
      if (!res.first) {
        if (e.kg > s.maxKg + EPS) res.types.push({ t: 'weight', prev: s.maxKg });
        if (ee !== null && s.maxE > 0 && ee > s.maxE + 0.05) res.types.push({ t: 'e1rm', prev: s.maxE });
        var atOrAbove = s.sets.filter(function (x) { return x.kg >= e.kg - EPS; });
        if (atOrAbove.length) {
          var mr = Math.max.apply(null, atOrAbove.map(function (x) { return x.reps; }));
          if (e.reps > mr) res.types.push({ t: 'reps', prev: mr });
        }
      }
      s.maxKg = Math.max(s.maxKg, e.kg);
      if (ee !== null) s.maxE = Math.max(s.maxE, ee);
      s.sets.push({ kg: e.kg, reps: e.reps });
      out[e.id] = res;
    });
    return out;
  }
  // Collapses the flagged sets of one lift in one workout into one line per PR type.
  function exPRs(sets, flags) {
    var res = { lines: [], base: false };
    var by = { weight: [], e1rm: [], reps: [] };
    sets.forEach(function (e) {
      var f = flags[e.id];
      if (!f) return;
      if (f.first) res.base = true;
      f.types.forEach(function (t) { by[t.t].push({ e: e, t: t }); });
    });
    var u = state.unit;
    if (by.weight.length) {
      var w0 = by.weight[0], w1 = by.weight[by.weight.length - 1];
      res.lines.push('Weight PR: ' + fmtW(w1.e.kg) + ' ' + u + ', up from ' + fmtW(w0.t.prev) + ' ' + u);
    }
    if (by.e1rm.length) {
      var q0 = by.e1rm[0], q1 = by.e1rm[by.e1rm.length - 1];
      res.lines.push('Est. 1RM PR: ' + fmtW(e1rm(q1.e.kg, q1.e.reps)) + ' ' + u + ', up from ' + fmtW(q0.t.prev) + ' ' + u);
    }
    if (by.reps.length) {
      var r1 = by.reps[by.reps.length - 1];
      res.lines.push('Rep PR: ' + r1.e.reps + ' reps at ' + fmtW(r1.e.kg) + ' ' + u + ' (previous best ' + r1.t.prev + ')');
    }
    return res;
  }
  function bests(k) {
    var heavy = null, est = null, estVal = -1;
    state.entries.forEach(function (e) {
      if (key(e.ex) !== k) return;
      if (!heavy || e.kg > heavy.kg + EPS || (Math.abs(e.kg - heavy.kg) <= EPS && e.reps > heavy.reps)) heavy = e;
      var v = e1rm(e.kg, e.reps);

    return { heavy: heavy, est: est, estVal: estVal };
  }
  function lastSession(k, exWid) {
    var best = null;
    state.entries.forEach(function (e) {

    if (!best) return [];
    var g = grp(best);
    return state.entries.filter(function (e) { return key(e.ex) === k && grp(e) === g; }).sort(cmpEntries);
  }

  function summaryHTML(w) {

  function planAction(a, t) {

  /* Mifflin-St Jeor calorie calculator */

    ['Moderately active', '3 to 5 workouts a week', 1.55], ['Very active', '6 to 7 workouts a week', 1.725],
    ['Extremely active', 'Hard training plus a physical job', 1.9]];
  function calcInitDrafts() {
    var c = state.calc;
    ui.calcDraft = { age: c.age ? String(c.age) : '', h: '', hin: '', w: '' };
    if (c.cm) {
      if (c.imp) { var ti = Math.round(c.cm / 2.54); ui.calcDraft.h = String(Math.floor(ti / 12)); ui.calcDraft.hin = String(ti % 12); }
      else ui.calcDraft.h = String(Math.round(c.cm));
    }
    if (c.kg) ui.calcDraft.w = c.imp ? String(+(c.kg * LB).toFixed(1)) : String(+c.kg.toFixed(1));
  }
  function calcParse() {
    var d = ui.calcDraft, c = state.calc;
    var age = Number(d.age), w = Number(d.w);
    var cm = c.imp ? (Number(d.h || 0) * 12 + Number(d.hin || 0)) * 2.54 : Number(d.h);
    var kg = c.imp ? w / LB : w;
    if (!(age >= 18 && age <= 100)) return { err: 'This calculator is for adults aged 18 to 100.' };
    if (!(cm >= 100 && cm <= 250)) return { err: 'Check your height.' };
    if (!(kg >= 30 && kg <= 300)) return { err: 'Check your weight.' };
    return { age: Math.round(age), cm: cm, kg: kg };
  }
  function calcPlans(tdee) {
    var c = state.calc, imp = c.imp;
    var perUnit = imp ? 3500 : 7700;
    var rates = c.goal === 'lose' ? (imp ? [0.5, 1, 1.5, 2] : [0.25, 0.5, 0.75, 1]) : (imp ? [0.5, 1, 1.5] : [0.25, 0.5, 0.75]);
    var floor = c.sex === 'm' ? 1500 : 1200;
    var m = Math.round(tdee / 10) * 10;
    var out = [];
    rates.forEach(function (r) {
      var delta = r * perUnit / 7;
      var kcal = Math.round((c.goal === 'lose' ? tdee - delta : tdee + delta) / 10) * 10;
      var limited = false;
      if (c.goal === 'lose' && kcal < floor) { kcal = floor; limited = true; }
      if (limited && out.length && out[out.length - 1].limited) return;
      out.push({ rate: r, unit: imp ? 'lb' : 'kg', kcal: kcal, diff: Math.abs(kcal - m), limited: limited });
    });
    return out;
  }
  function calcHTML() {
    var c = state.calc, d = ui.calcDraft;
    function seg(aria, act, opts, cur) {
      return '<div class="unit" role="group" aria-label="' + aria + '">' + opts.map(function (o) {
        return '<button type="button" data-a="' + act + '" data-v="' + o[0] + '" aria-pressed="' + (String(cur) === String(o[0])) + '">' + o[1] + '</button>';
      }).join('') + '</div>';
    }
    function f(id, k, label) {
      return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" data-cd="' + k + '" inputmode="decimal" autocomplete="off" value="' + esc(d[k]) + '"></div>';
    }
    var html = '<div class="calc"><h3>Calorie calculator</h3><div class="crow">' +
      seg('Sex', 'calc-sex', [['m', 'Male'], ['f', 'Female']], c.sex) +
      seg('Units', 'calc-units', [['metric', 'kg, cm'], ['imperial', 'lb, ft']], c.imp ? 'imperial' : 'metric') + '</div>' +
      '<div class="cfields">' + f('cage', 'age', 'Age') +
      (c.imp ? f('chf', 'h', 'Height (ft)') + f('chi', 'hin', 'Height (in)') : f('chc', 'h', 'Height (cm)')) +
      f('cwt', 'w', 'Weight (' + (c.imp ? 'lb' : 'kg') + ')') + '</div>' +

        return '<button type="button" class="actbtn" data-a="calc-act" data-v="' + i + '" aria-pressed="' + (c.act === i) + '"><span class="an">' + a[0] + '</span><span class="sub">' + a[1] + '</span></button>';
      }).join('') + '</div>' +
      seg('Goal', 'calc-goal', [['lose', 'Lose weight'], ['maintain', 'Maintain'], ['gain', 'Gain weight']], c.goal) +
      (ui.calcErr ? '<p class="err" style="margin:0">' + esc(ui.calcErr) + '</p>' : '') +
      '<button type="button" class="primary" data-a="calc-run">Calculate</button>';
    if (ui.calcShown) {
      var p = calcParse();
      if (!p.err) {
        var bmr = 10 * p.kg + 6.25 * p.cm - 5 * p.age + (c.sex === 'm' ? 5 : -161);
        var tdee = bmr * ACT[c.act][2];
        var m = Math.round(tdee / 10) * 10;
        html += '<div class="stats cstats"><div class="stat"><span class="num">' + fmtK(bmr) + '</span><span class="l">BMR (kcal)</span></div>' +
          '<div class="stat"><span class="num">' + fmtK(m) + '</span><span class="l">Maintenance (kcal)</span></div></div>';
        function row(title, sub, kcal) {
          return '<div class="meal"><div class="mn"><span class="mname">' + esc(title) + '</span><span class="sub">' + esc(sub) + '</span></div>' +
            '<button type="button" class="secondary" data-a="calc-use" data-kcal="' + kcal + '">Use</button></div>';
        }
        if (c.goal === 'maintain') {
          html += row('Maintain weight', fmtK(m) + ' kcal a day', m);
        } else {
          calcPlans(tdee).forEach(function (pl) {
            html += row((c.goal === 'lose' ? 'Lose ' : 'Gain ') + pl.rate + ' ' + pl.unit + ' a week',
              fmtK(pl.kcal) + ' kcal a day \u00B7 ' + fmtK(pl.diff) + (c.goal === 'lose' ? ' below' : ' above') + ' maintenance' +
              (pl.limited ? ' \u00B7 lowest level this calculator recommends' : ''), pl.kcal);

  }
  function calcAction(a, t) {
    var c = state.calc, v = t.dataset.v;
    if (a === 'calc-toggle') {

      if (ui.calcOpen) { calcInitDrafts(); ui.focus = '#cage'; }
    } else if (a === 'calc-sex') { c.sex = v; persist(); }
    else if (a === 'calc-units') {
      var want = v === 'imperial';
      if (want !== c.imp) {
        var p = calcParse();
        c.imp = want;
        if (!p.err) { c.age = p.age; c.cm = p.cm; c.kg = p.kg; calcInitDrafts(); }
        else { ui.calcDraft.h = ''; ui.calcDraft.hin = ''; ui.calcDraft.w = ''; }
      }
      persist();
    } else if (a === 'calc-act') { c.act = +v; persist(); }
    else if (a === 'calc-goal') { c.goal = v; persist(); }

      var q = calcParse();

    } else if (a === 'calc-use') {

  }

  function targetHTML(eaten) {

        '<p class="sub tleft">' + (diff >= 0 ? fmtK(diff) + ' kcal left' : fmtK(-diff) + ' kcal over') + '</p>';
    }
    return html + '<div class="trow"><label for="mtarget">Daily calorie target</label><input id="mtarget" inputmode="numeric" autocomplete="off" value="' + (tg || '') + '"></div><button type="button" class="linkbtn calclink" data-a="calc-toggle">' + (ui.calcOpen ? 'Close calculator' : 'Work out my target') + '</button>';
  }

      '<div class="stat"><span class="num">' + fmtK(tot.kcal) + '</span><span class="l">' + (state.calTarget ? 'of ' + fmtK(state.calTarget) + ' kcal' : 'Calories') + '</span></div>' +
      '<div class="stat"><span class="num">' + fmtG(tot.p) + '</span><span class="l">Protein (g)</span></div>' +

      mfield('mc', 'c', 'Carbs (g)') + mfield('mf', 'f', 'Fats (g)') +

  }
  function addMeal() {

  /* ---------- Records tab ---------- */
  function chartHTML(k, flags) {
    var byDay = {};
    state.entries.filter(function (e) { return key(e.ex) === k; }).forEach(function (e) {
      var v = e1rm(e.kg, e.reps);
      if (v === null) v = e.kg;
      var d = byDay[e.date] || (byDay[e.date] = { date: e.date, v: -1, pr: false });
      if (v > d.v) d.v = v;
      var f = flags[e.id];
      if (f && f.types.some(function (t) { return t.t === 'e1rm' || t.t === 'weight'; })) d.pr = true;
    });
    var pts = Object.keys(byDay).sort().map(function (d) { return byDay[d]; });
    if (pts.length < 2) return '';
    var W = 480, H = 190, L = 44, R = 14, T = 14, B = 28;
    var t0 = new Date(pts[0].date + 'T00:00:00').getTime();
    var t1 = new Date(pts[pts.length - 1].date + 'T00:00:00').getTime();
    var vmin = Math.min.apply(null, pts.map(function (p) { return p.v; }));
    var vmax = Math.max.apply(null, pts.map(function (p) { return p.v; }));
    var padv = (vmax - vmin) * 0.15 || vmax * 0.05 || 1;
    var lo = Math.max(0, vmin - padv), hi = vmax + padv;
    function X(d) {
      var t = new Date(d + 'T00:00:00').getTime();
      return L + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - L - R);
    }
    function Y(v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); }
    var line = pts.map(function (p) { return X(p.date).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Estimated one rep max over time">' +
      '<line x1="' + L + '" y1="' + Y(hi) + '" x2="' + (W - R) + '" y2="' + Y(hi) + '" stroke="var(--line)"/>' +
      '<line x1="' + L + '" y1="' + Y(lo) + '" x2="' + (W - R) + '" y2="' + Y(lo) + '" stroke="var(--line)"/>' +
      '<text x="' + (L - 6) + '" y="' + (Y(hi) + 4) + '" text-anchor="end" font-size="12" fill="var(--mute)">' + fmtW(hi) + '</text>' +

      '<text x="' + L + '" y="' + (H - 8) + '" font-size="12" fill="var(--mute)">' + fmtDate(pts[0].date) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" font-size="12" fill="var(--mute)">' + fmtDate(pts[pts.length - 1].date) + '</text>' +

    });
    return svg + '</svg>';
  }

  function recordsHTML() {
    if (!state.entries.length) {

    var groups = {};

      var k = key(e.ex);

      return '<div class="tl"><span class="d">' + fmtDate(e.date, true) + '</span><span class="s">' + fmtW(e.kg) + ' ' + state.unit + ' \u00D7 ' + e.reps + '</span><span>' + chips(flags[e.id]) + '</span></div>';
    }).join('') : '') + '</div></div>';
    return html;
  }

  /* ---------- render ---------- */
  function renderLifts() {

  /* ---------- actions ---------- */
  function startWorkout(planId) {

    state.active = { id: uid(), start: Date.now(), date: today(), exercises: [], targets: {}, plan: plan ? plan.name : null, planId: plan ? plan.id : null };
    ui.summary = null; ui.drafts = {}; ui.err = null; ui.newEx = '';
    if (plan) {
      plan.exercises.forEach(function (x) {
        var k = key(x.name);
        if (state.active.exercises.some(function (n) { return key(n) === k; })) return;
        state.active.exercises.push(x.name);
        state.active.targets[k] = { sets: x.sets };

      });

  }
  function addExercise() {

    var k = key(name);
    var known = state.entries.filter(function (e) { return key(e.ex) === k; })[0];
    if (known) name = known.ex;
    else COMMON.forEach(function (c) { if (key(c) === k) name = c; });
    var idx = -1;
    state.active.exercises.forEach(function (n, i) { if (key(n) === k) idx = i; });
    if (idx === -1) {
      state.active.exercises.push(name);
      idx = state.active.exercises.length - 1;
      prefill(name);
    }
    ui.newEx = ''; ui.err = null;
    persist();
    ui.focus = '[data-dw="' + idx + '"]';
    render();
  }
  function addSet(i) {
    var name = state.active.exercises[i];
    var d = getDraft(key(name));
    var w = parseFloat(String(d.w).replace(',', '.'));
    var rs = String(d.r).trim();
    var r = parseInt(rs, 10);
    if (!isFinite(w) || w < 0) { ui.err = { i: i, msg: 'Enter a weight of 0 or more in ' + state.unit + '.' }; ui.focus = '[data-dw="' + i + '"]'; render(); return; }
    if (!/^\d+$/.test(rs) || r < 1 || r > 100) { ui.err = { i: i, msg: 'Enter reps as a whole number from 1 to 100.' }; ui.focus = '[data-dr="' + i + '"]'; render(); return; }
    state.entries.push({ id: uid(), ex: name, kg: Math.round(toKg(w) * 10000) / 10000, reps: r, date: state.active.date, ts: Date.now(), wid: state.active.id });
    ui.err = null;
    persist();
    ui.focus = '[data-dr="' + i + '"]';
    render();
  }
  function finishWorkout() {

    if (!n) { ui.err = { i: -1, msg: 'Log at least one set before finishing, or discard the workout.' }; render(); return; }
    state.workouts.push({ id: a.id, date: a.date, start: a.start, end: Date.now(), plan: a.plan || null, planId: a.planId || null });
    state.active = null;
    ui.summary = a.id; ui.drafts = {}; ui.err = null; ui.armed = null;
    persist();
    render();
    window.scrollTo(0, 0);
  }
  function armThen(token, fn) {
    if (ui.armed === token) { ui.armed = null; fn(); return; }
    ui.armed = token;
    render();
    setTimeout(function () { if (ui.armed === token) { ui.armed = null; render(); } }, 3000);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-a]');
    if (!t) return;
    var a = t.dataset.a;
    if (a === 'unit') {
      if (t.dataset.unit === state.unit) return;
      var old = state.unit;
      Object.keys(ui.drafts).forEach(function (k) {
        var v = parseFloat(String(ui.drafts[k].w).replace(',', '.'));
        if (isFinite(v)) {
          var kg = old === 'kg' ? v : v / LB;
          state.unit = t.dataset.unit;
          ui.drafts[k].w = fmtW(kg);
          state.unit = old;
        }
      });
      state.unit = t.dataset.unit;
      persist(); render();
    } else if (a === 'tab') {
      ui.tab = t.dataset.tab; ui.err = null; render();
    } else if (a === 'start') startWorkout(t.dataset.plan);
    else if (a.indexOf('scan-') === 0) scanAction(a);
    else if (a.indexOf('calc-') === 0) calcAction(a, t);
    else if (a.indexOf('meal-') === 0) mealAction(a, t);
    else if (a.indexOf('cal-') === 0) calAction(a, t);
    else if (a.indexOf('plan-') === 0) planAction(a, t);
    else if (a === 'addex') addExercise();
    else if (a === 'addset') addSet(+t.dataset.i);
    else if (a === 'finish') finishWorkout();
    else if (a === 'done') { ui.summary = null; render(); }
    else if (a === 'rmset') {
      state.entries = state.entries.filter(function (e) { return e.id !== t.dataset.id; });
      persist(); render();
    } else if (a === 'rmex') {
      state.active.exercises.splice(+t.dataset.i, 1);
      persist(); render();
    } else if (a === 'discard') {
      armThen('discard', function () {
        var id = state.active.id;
        state.entries = state.entries.filter(function (e) { return e.wid !== id; });
        state.active = null; ui.drafts = {}; ui.err = null;
        persist(); render();
      });
    } else if (a === 'sel') { ui.sel = t.dataset.key; render(); }
    else if (a === 'togglewk') { ui.open[t.dataset.id] = !ui.open[t.dataset.id]; ui.focus = '[data-a="togglewk"][data-id="' + t.dataset.id + '"]'; render(); }
    else if (a === 'morehist') { ui.histShown += 15; render(); }
    else if (a === 'delwk') {
      var id = t.dataset.id;
      armThen('wk:' + id, function () {
        state.entries = state.entries.filter(function (e) {
          return id.indexOf('d:') === 0 ? !(!e.wid && e.date === id.slice(2)) : e.wid !== id;
        });
        state.workouts = state.workouts.filter(function (w) { return w.id !== id; });
        persist(); render();
      });
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset.sg !== undefined && ui.scan) { ui.scan.grams = t.value; applyScan(); return; }
    if (t.dataset.cd !== undefined) { ui.calcDraft[t.dataset.cd] = t.value; return; }
    if (t.dataset.md !== undefined) { ui.mealDraft[t.dataset.md] = t.value; return; }
    if (t.id === 'newex') { ui.newEx = t.value; return; }
    if (t.id === 'pname' && ui.edit) { ui.edit.name = t.value; return; }
    if (t.dataset.pe !== undefined && ui.edit) { ui.edit.exercises[+t.dataset.pe][t.dataset.f] = t.value; return; }
    if (t.dataset.dw !== undefined && state.active) getDraft(key(state.active.exercises[+t.dataset.dw])).w = t.value;
    else if (t.dataset.dr !== undefined && state.active) getDraft(key(state.active.exercises[+t.dataset.dr])).r = t.value;
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var t = ev.target;
    if (t.id === 'newex') { ev.preventDefault(); addExercise(); }
    else if (t.dataset && t.dataset.cd !== undefined) { ev.preventDefault(); calcAction('calc-run', t); }
    else if (t.dataset && t.dataset.md !== undefined) { ev.preventDefault(); mealEnter(t); }
    else if (t.dataset && t.dataset.dw !== undefined) { ev.preventDefault(); var r = document.querySelector('[data-dr="' + t.dataset.dw + '"]'); if (r) r.focus(); }
    else if (t.dataset && t.dataset.dr !== undefined) { ev.preventDefault(); addSet(+t.dataset.dr); }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id !== 'mtarget') return;
    var n = Math.round(Number(String(t.value).trim().replace(',', '.')));
    state.calTarget = isFinite(n) && n > 0 && n <= 20000 ? n : 0;
    persist();
    render();
  });

  setInterval(function () {
    var el = $('elapsed');
    if (el && state.active) el.textContent = fmtDur(Date.now() - state.active.start);
  }, 1000);

  /* ---------- start ---------- */
  loadLocal();
  if (state.active) ui.tab = 'workout';
  render();
  initRemote();
})();
</script>
</body>
</html>
